name: LVL LOOL Android QA and APK
# Release signing secrets are required for the protected APK build.
# Clean six-season APK build trigger: 2026-09-23

on:
  workflow_dispatch:
  push:
    branches: [main, FINAL-FIX-SECURITY-2026-09-25]

jobs:
  qa-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Flutter dependencies
        run: flutter pub get

      - name: Validate Cloud Functions syntax
        run: node --check firebase_functions/index.js

      - name: Validate Firestore rules are default-deny for sensitive data
        shell: bash
        run: |
          grep -q "allow write: if false" firestore.rules
          grep -q "allow update: if false" firestore.rules
          grep -q "allow create, delete: if false" firestore.rules

      - name: Verify forbidden legacy references
        shell: bash
        run: |
          if grep -RniE '3minutes|level_devil' lib android pubspec.yaml .firebaserc; then
            echo "Forbidden legacy reference found."
            exit 1
          fi

      - name: Flutter analyze
        run: dart analyze --no-fatal-warnings

      - name: Flutter tests
        run: flutter test --reporter expanded

      - name: Prepare LVL LOOL release signing
        env:
          LVLLOOL_KEYSTORE_BASE64: ${{ secrets.LVLLOOL_KEYSTORE_BASE64 }}
          LVLLOOL_KEYSTORE_PASSWORD: ${{ secrets.LVLLOOL_KEYSTORE_PASSWORD }}
          LVLLOOL_KEY_PASSWORD: ${{ secrets.LVLLOOL_KEY_PASSWORD }}
        run: |
          test -n "$LVLLOOL_KEYSTORE_BASE64"
          test -n "$LVLLOOL_KEYSTORE_PASSWORD"
          test -n "$LVLLOOL_KEY_PASSWORD"
          echo "$LVLLOOL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lvllo-release.jks"
          echo "LVLLOOL_KEYSTORE_PATH=$RUNNER_TEMP/lvllo-release.jks" >> "$GITHUB_ENV"
          echo "LVLLOOL_KEYSTORE_PASSWORD=$LVLLOOL_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "LVLLOOL_KEY_PASSWORD=$LVLLOOL_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          unzip -t build/app/outputs/flutter-apk/app-release.apk >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LVL-LOOL-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
